<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
    <title id="title">Schéma du mécanisme d'authentification Access Token / Refresh Token</title>
    <desc id="desc">Diagramme de séquence entre le client jQuery, l'API PHP et la base MySQL.</desc>

    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#334e68"/>
        </marker>
        <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6c00"/>
        </marker>
        <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#c62828"/>
        </marker>

        <style>
            text {
                font-family: "Segoe UI", Arial, sans-serif;
                font-size: 13px;
                fill: #1f2933;
            }

            .title {
                font-size: 24px;
                font-weight: 700;
                fill: #0f172a;
            }

            .subtitle {
                font-size: 13px;
                fill: #52606d;
            }

            .actor {
                font-size: 15px;
                font-weight: 700;
                fill: #ffffff;
            }

            .lifeline {
                stroke: #cbd2d9;
                stroke-width: 2;
                stroke-dasharray: 6 6;
                fill: none;
            }

            .msg {
                font-size: 12.5px;
                paint-order: stroke;
                stroke: #ffffff;
                stroke-width: 5px;
                stroke-linejoin: round;
            }

            .selfbox {
                fill: #f0f4f8;
                stroke: #bcccdc;
                stroke-width: 1.5;
            }

            .normal {
                stroke: #334e68;
                stroke-width: 2;
                fill: none;
            }

            .refresh {
                stroke: #ef6c00;
                stroke-width: 2.5;
                fill: none;
            }

            .error {
                stroke: #c62828;
                stroke-width: 2.5;
                fill: none;
            }

            .dashed {
                stroke-dasharray: 7 5;
            }

            .legend {
                font-size: 12.5px;
                fill: #334e68;
            }
        </style>
    </defs>

    <rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>

    <text x="600" y="38" text-anchor="middle" class="title">Authentification de l'API : Access Token &amp; Refresh Token</text>
    <text x="600" y="62" text-anchor="middle" class="subtitle">Client jQuery (navigateur) — API PHP — MySQL</text>

    <!-- Acteurs -->
    <rect x="100" y="90" width="220" height="46" rx="8" fill="#1565c0"/>
    <text x="210" y="119" text-anchor="middle" class="actor">Client jQuery</text>

    <rect x="490" y="90" width="220" height="46" rx="8" fill="#2e7d32"/>
    <text x="600" y="119" text-anchor="middle" class="actor">API PHP</text>

    <rect x="880" y="90" width="220" height="46" rx="8" fill="#6a1b9a"/>
    <text x="990" y="119" text-anchor="middle" class="actor">MySQL</text>

    <!-- Lignes de vie -->
    <line x1="210" y1="136" x2="210" y2="800" class="lifeline"/>
    <line x1="600" y1="136" x2="600" y2="800" class="lifeline"/>
    <line x1="990" y1="136" x2="990" y2="800" class="lifeline"/>

    <!-- 1. Login -->
    <line x1="320" y1="180" x2="490" y2="180" class="normal" marker-end="url(#arrow)"/>
    <text x="405" y="171" text-anchor="middle" class="msg">1. POST /api/login</text>
    <text x="405" y="195" text-anchor="middle" class="msg">email + mot de passe</text>

    <!-- 2. Vérification en base -->
    <line x1="710" y1="225" x2="880" y2="225" class="normal" marker-end="url(#arrow)"/>
    <text x="795" y="216" text-anchor="middle" class="msg">2. SELECT user + password_verify()</text>

    <!-- 3. Réponse base -->
    <line x1="880" y1="258" x2="710" y2="258" class="normal dashed" marker-end="url(#arrow)"/>
    <text x="795" y="249" text-anchor="middle" class="msg">3. Utilisateur valide</text>

    <!-- 4. Génération des jetons -->
    <rect x="415" y="280" width="370" height="48" rx="8" class="selfbox"/>
    <text x="600" y="300" text-anchor="middle" class="msg">4. Access Token JWT (5 min)</text>
    <text x="600" y="318" text-anchor="middle" class="msg">+ Refresh Token aléatoire (7 jours)</text>

    <!-- 5. Stockage refresh token -->
    <line x1="710" y1="350" x2="880" y2="350" class="normal" marker-end="url(#arrow)"/>
    <text x="795" y="341" text-anchor="middle" class="msg">5. INSERT refresh_token (hash, expires_at)</text>

    <!-- 6. Réponse login -->
    <line x1="710" y1="390" x2="320" y2="390" class="normal dashed" marker-end="url(#arrow)"/>
    <text x="515" y="371" text-anchor="middle" class="msg">6. 200 { accessToken, user }</text>
    <text x="515" y="386" text-anchor="middle" class="msg">Set-Cookie : refresh_token (HttpOnly)</text>

    <!-- 7. Requête protégée -->
    <line x1="320" y1="440" x2="490" y2="440" class="normal" marker-end="url(#arrow)"/>
    <text x="405" y="431" text-anchor="middle" class="msg">7. GET /api/user/1</text>
    <text x="405" y="455" text-anchor="middle" class="msg">Authorization : Bearer &lt;accessToken&gt;</text>

    <!-- 8. Vérification JWT -->
    <rect x="415" y="470" width="370" height="34" rx="8" class="selfbox"/>
    <text x="600" y="491" text-anchor="middle" class="msg">8. Vérifie signature + expiration → OK</text>

    <!-- 9. Réponse protégée -->
    <line x1="490" y1="525" x2="320" y2="525" class="normal dashed" marker-end="url(#arrow)"/>
    <text x="405" y="516" text-anchor="middle" class="msg">9. 200 { données }</text>

    <!-- 10. Expiration -->
    <rect x="55" y="550" width="310" height="36" rx="8" class="selfbox"/>
    <text x="210" y="572" text-anchor="middle" class="msg">10. Après 5 minutes : token expiré</text>

    <!-- 11. Requête avec token expiré -->
    <line x1="320" y1="615" x2="490" y2="615" class="normal" marker-end="url(#arrow)"/>
    <text x="405" y="606" text-anchor="middle" class="msg">11. GET /api/user/1 (ancien token)</text>

    <!-- 12. 401 -->
    <line x1="490" y1="645" x2="320" y2="645" class="error" marker-end="url(#arrowRed)"/>
    <text x="405" y="636" text-anchor="middle" class="msg">12. 401 Unauthorized</text>

    <!-- 13. Refresh -->
    <line x1="320" y1="685" x2="490" y2="685" class="refresh" marker-end="url(#arrowOrange)"/>
    <text x="405" y="666" text-anchor="middle" class="msg">13. POST /api/token/refresh</text>
    <text x="405" y="681" text-anchor="middle" class="msg">cookie HttpOnly automatique</text>

    <!-- 14. Vérification refresh token -->
    <line x1="710" y1="720" x2="880" y2="720" class="refresh" marker-end="url(#arrowOrange)"/>
    <text x="795" y="701" text-anchor="middle" class="msg">14. Vérifie hash + revoked = 0</text>
    <text x="795" y="716" text-anchor="middle" class="msg">expires_at &gt; NOW()</text>

    <!-- 15. Nouveau token -->
    <line x1="710" y1="755" x2="320" y2="755" class="refresh dashed" marker-end="url(#arrowOrange)"/>
    <text x="515" y="746" text-anchor="middle" class="msg">15. 200 { accessToken, user }</text>

    <!-- 16. Reprise -->
    <rect x="55" y="770" width="310" height="36" rx="8" class="selfbox"/>
    <text x="210" y="792" text-anchor="middle" class="msg">16. Rejoue la requête → 200</text>

    <!-- Légende -->
    <line x1="60" y1="835" x2="105" y2="835" class="normal"/>
    <text x="113" y="839" class="legend">Access Token (JWT, 5 min)</text>

    <line x1="320" y1="835" x2="365" y2="835" class="refresh"/>
    <text x="373" y="839" class="legend">Refresh Token (7 jours, HttpOnly, révocable)</text>

    <line x1="720" y1="835" x2="765" y2="835" class="error"/>
    <text x="773" y="839" class="legend">401 Unauthorized</text>

    <text x="600" y="872" text-anchor="middle" class="legend">
        Déconnexion : POST /api/logout → révocation du Refresh Token (revoked = 1) + suppression du cookie
    </text>
</svg>
